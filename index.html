<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conselho do Tarot do Dia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">Tarot diário</p>
        <h1 data-i18n="title">Conselho do Tarot do Dia</h1>
      </div>

      <div class="topbar-actions">
        <select id="languageSelect" class="language-select" aria-label="Idioma">
          <option value="pt">Português</option>
          <option value="en">English</option>
        </select>

        <button id="themeToggle" class="ghost-button" type="button">Modo escuro</button>
      </div>
    </header>

    <section class="reading">
      <article class="tarot-card">
        <img id="cardImage" class="card-image" src="" alt="Imagem da carta" />
      </article>

      <article class="message-panel">
        <p id="readingType" class="reading-type">Carta do dia</p>
        <h2 id="cardTitle">A Estrela</h2>
        <p id="cardMeaning" class="meaning"></p>

        <div class="advice-box">
          <span data-i18n="adviceLabel">Conselho</span>
          <p id="cardAdvice"></p>
        </div>

        <div class="reflection-box">
          <span data-i18n="reflectionLabel">Pergunta para hoje</span>
          <p id="cardReflection"></p>
        </div>

        <div class="actions">
          <button id="dailyButton" type="button">Ver carta do dia</button>
          <button id="freeDrawButton" class="secondary-button" type="button">Sortear livremente</button>
        </div>
      </article>
    </section>

    <section class="deck-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="deckEyebrow">Baralho completo</p>
          <h2 data-i18n="allCards">Todas as cartas</h2>
        </div>

        <div class="deck-filters">
          <button class="deck-filter active" type="button" data-filter="todos" data-i18n="filterAll">Todas</button>
          <button class="deck-filter" type="button" data-filter="Maior" data-i18n="filterMajor">Maiores</button>
          <button class="deck-filter" type="button" data-filter="Paus" data-i18n="filterWands">Paus</button>
          <button class="deck-filter" type="button" data-filter="Copas" data-i18n="filterCups">Copas</button>
          <button class="deck-filter" type="button" data-filter="Espadas" data-i18n="filterSwords">Espadas</button>
          <button class="deck-filter" type="button" data-filter="Ouros" data-i18n="filterPentacles">Ouros</button>
        </div>
      </div>

      <div id="deckGrid" class="deck-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
